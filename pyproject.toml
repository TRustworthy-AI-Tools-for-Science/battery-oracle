[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "battery-oracle"
version = "0.4.0"
description = "Standalone PyBaMM/SPMe battery oracle (simulator) + EIS + ECM fitting, with an Optuna calibration engine."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Ashley Dale", email = "ashley.dale@utoronto.ca" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=2.0.0",
    "pandas",
    "scipy>=1.10.0",
    "matplotlib",
    "impedance",
    "pybamm>=26.4.3,<27",
    "pyyaml",
]

[project.optional-dependencies]
# Bayesian ECM fitting. Without it, PyBaMMOracle falls back to the fast analytic
# Randles stub (_randles_stub_ecm) for the ECM step.
autoeis = [
    "autoeis>=0.0.30",
    "mpire>=2.10.0",
]
# Distribution-of-relaxation-times peaks (get_drt_impedance). Lazy-imported; DRT
# peaks are simply omitted when absent. The DRT libraries themselves are not on
# PyPI, so they must be installed manually:
#   pip install "hybrid-drt @ git+https://github.com/jdhuang-csm/hybrid-drt.git" "Mittag-Leffler @ git+https://github.com/jdhuang-csm/mittag-leffler.git"
drt = [
    "tqdm",
]
# Oracle calibration engine (battery_oracle.tune / battery-oracle-tune CLI).
tune = [
    "optuna>=3.6.1",
]
# Jupyter kernel for the notebooks/ directory. The `battery-oracle-venv` kernel
# launches `.venv/bin/python3 -m ipykernel_launcher`, so ipykernel must be in the
# venv itself or the kernel fails to start. ipywidgets keeps Optuna/tqdm progress
# bars from degrading to plain text.
notebook = [
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
]
# For a nicer logging handler in battery_oracle._plotting.get_logger.
rich = [
    "rich>=13.0.0",
]
# Documentation site (Sphinx + furo + notebook rendering). Heavy runtime extras
# (autoeis/optuna/drt) are lazy-imported in source, so autodoc mocks them.
docs = [
    "sphinx>=8.0",
    "furo>=2024.8.6",
    "myst-nb>=1.1.2",
    "sphinx-copybutton>=0.5.2",
    "sphinxcontrib-bibtex>=2.6",
    "linkify-it-py>=2.0",
]

[project.scripts]
battery-oracle-tune = "battery_oracle.tune:main"
battery-oracle-tune-plot = "battery_oracle.tune_plots:main"

[project.urls]
Homepage = "https://github.com/TRustworthy-AI-Tools-for-Science/battery-oracle"
Documentation = "https://trustworthy-ai-tools-for-science.github.io/battery-oracle/"
Repository = "https://github.com/TRustworthy-AI-Tools-for-Science/battery-oracle"
Issues = "https://github.com/TRustworthy-AI-Tools-for-Science/battery-oracle/issues"

[dependency-groups]
# Installed by a bare `uv sync` (see [tool.uv] default-groups). The self-referential
# `battery-oracle[...]` entries make the dev environment carry the extras the normal
# workflow imports, so a plain `uv sync` yields a venv that can actually run the
# tune engine and the notebooks.
#
# Why this matters: `uv sync` prunes anything it does not resolve. When `tune` was
# not wired in here, syncing silently *removed* optuna, and `battery_oracle.tune`
# then failed inside Optuna's RDB storage with a misleading Alembic error --
# "Path doesn't exist: .../optuna/storages/_rdb/alembic ... use the 'init' command".
# Optuna ships those migration scripts inside its own package, so an absent optuna
# looks exactly like an absent migrations folder. Do not "fix" that by running
# `alembic init`; it means the extra is not installed.
#
# `autoeis` and `drt` stay opt-in: both are heavy, and the oracle degrades cleanly
# without them (Randles stub / DRT peaks omitted). `docs` is only for the Sphinx
# build. Add those per-invocation with `uv sync --extra autoeis`, etc.
dev = [
    "battery-oracle[tune]",
    "battery-oracle[notebook]",
    "battery-oracle[rich]",
    "pytest>=8.0",
    "ruff",
]

[tool.uv]
# Groups installed by a bare `uv sync`. `uv sync` prunes whatever it does not
# resolve, so anything missing here is actively *uninstalled* on the next sync.
# `dev` pulls in the `tune`/`notebook`/`rich` extras (see [dependency-groups]).
default-groups = ["dev"]

[tool.uv.sources]
hybrid-drt     = { git = "https://github.com/jdhuang-csm/hybrid-drt.git" }
"Mittag-Leffler" = { git = "https://github.com/jdhuang-csm/mittag-leffler.git" }

[tool.hatch.build.targets.wheel]
packages = ["src/battery_oracle"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "slow: marks tests that run a full PyBaMM simulation (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Notebooks are intentionally loose exploratory code; docs build output is generated.
extend-exclude = ["notebooks", "docs/notebooks", "docs/_build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E501: long docstring/comment lines are intentional (formatter owns width).
# E702/E741: the codebase deliberately uses compact semicolon statements and the
# conventional single-letter `l` for circuit-label loops; not worth churning.
ignore = ["E501", "E702", "E741"]

[tool.ruff.lint.per-file-ignores]
# Vendored DRT helper carries an unused loop var from upstream.
"src/battery_oracle/_eis/drt.py" = ["F841"]
