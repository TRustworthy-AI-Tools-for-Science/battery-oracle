# Base PyBaMMOracle hyperparameters (oracle.py defaults, Chen2020 parameter set).
#
# This file is parsed, not just documentation: every field here is read by
# battery_oracle.experiment.oracle_kwargs_from_oracle_config() and used to
# override PyBaMMOracle's own Python-literal defaults. A field omitted here
# falls back to that Python default. This is the fallback config: dataset-
# specific calibrations (battery-forecast's oracle_tune writes them as
# config_oracle_{dataset}.yml) override any field here (commonly
# `protocol_scaling` and `degradation`) -- point an experiment YAML's
# top-level `oracle_config:` field at one to use it.

cycling:
  n_cycles: 1
  parameter_set: Chen2020          # pybamm.ParameterValues("Chen2020"), 5 Ah NMC/graphite pouch cell
  chemistry: Chen2020              # #14: must agree with parameter_set (validated). Chen2020 | LiR2032 sets (parameter_sets.SUPPORTED_PARAMETER_SETS).
                                   # Non-Chen2020 needs its own calibration YAML (bounds/preset) -- see config_oracle_{dataset}.yml.
  temperature_K: 298.15            # 25 degC; sets "Ambient temperature [K]" when != 298.15 (isothermal)
  initial_soc: 0.80                # first-call starting SOC (keeps initial OCV inside the voltage window)
  rest_s: 1200.0                   # OCV rest (s) on each side of a cycle, before/after EIS (Jones et al. 2022)
  # Thermal submodel (#9). "isothermal" (default) | "lumped" (Timms 2021: one ODE
  # coupling cell temperature to the electrochemistry). Lumped surfaces T_cell_K in
  # the state vector and shifts the degradation trajectory for non-ambient protocols.
  thermal: isothermal
  T_ambient_K: 298.15              # lumped-thermal ambient (K)
  h_total_W_per_m2K: 10.0          # lumped-thermal total heat-transfer coefficient
  use_temperature_protocol: false  # true -> opt-in 7-D protocol (slot 6 = per-cycle T_ambient_K); needs thermal: lumped
  # Discharge termination. "cutoff": every discharge runs to v_discharge_min with a
  # >= 1 h timeout (the jones2022 protocol: discharge until 3.0 V). "protocol": the
  # discharge runs for the protocol's own duration (or until v_discharge_min), for
  # time-limited protocols.
  discharge_mode: cutoff

# Beginning-of-life (BOL) fit, applied after the degradation preset (battery_oracle.params).
# parameter_scales: {PyBaMM parameter name: multiplier}; works for numeric and functional
#   parameters (e.g. exchange-current density). Composes with protocol_scaling.kinetics_scale.
# parameter_overrides: {PyBaMM parameter name: absolute value}.
# contact_resistance_ohm: series contact resistance in the 5 Ah PyBaMM frame; null = off.
# Written from a stage-A chain fit (battery_oracle.fit.chain.aggregate_chain; battery-forecast tune_oracle).
bol:
  parameter_scales: {}
  parameter_overrides: {}
  contact_resistance_ohm: null

solver:
  # Deliberately a different solver family (not just looser primary tolerances):
  # CasadiSolver(mode="safe") integrates through the CC->CV control-mode switch
  # that reproducibly trips IDAKLUSolver. See oracle.py:_build_native_state.
  emergency:
    rtol: 1.0e-2
    atol: 1.0e-5
  # DFN is a stiff coupled DAE: tight IDAKLU tolerances, and a low dt_max on the
  # Casadi solvers (primary fallback when IDAKLU is unavailable, and emergency) so
  # IDA can backstep before a hard failure at the CC->CV switch instead of silently
  # truncating. See oracle.py:_build_native_state.
  dfn:
    rtol: 1.0e-6
    atol: 1.0e-8
    dt_max_s: 1.0

# Protocol bounds. Sanitises protocol vectors before building the PyBaMM Experiment --
# see oracle.py:_sanitise_current/_sanitise_duration/_protocol_to_experiment.
# Currents are C-rates of the oracle cell's own nominal capacity (the simulated
# currents); protocols outside them are clipped with a warning.
protocol_bounds:
  c_min_crate: 0.01         # charge stage 1 / discharge lower bound (50 mA on 5 Ah)
  c_max_crate: 1.5          # charge stage 1 / discharge ceiling: the DFN's stable range
  c2_min_crate: 0.004       # charge stage 2 (taper stage) lower bound (20 mA on 5 Ah)
  c2_max_crate: 1.5         # charge stage 2 ceiling
  dur_min_s: 60.0
  dur_max_s: 28800.0        # 8 h
  v_charge_max: 4.3         # charge safety cutoff (V) -- Jones, Stimming & Lee 2022
  v_discharge_min: 3.0      # discharge cutoff (V)
  charge_stage_max_s: 900.0 # 15 min per CC charge stage (paper limit)

eis:
  freq_min_hz: 0.01
  freq_max_hz: 10000.0
  n_freq_points: 60                # np.logspace(-2, 4, 60)
  # Temperature-dependent EIS (#11), applied only when thermal: lumped. R_ct scales
  # Arrhenius-wise (exp(E_a/R (1/T_cell - 1/T_ref))); the electrolyte/ohmic intercept
  # scales with the smaller electrolyte activation energy. T_ref = 298.15 K.
  E_a_J_per_mol: 30000.0           # charge-transfer arc activation energy (LiPF6-typical)
  E_a_electrolyte_J_per_mol: 15000.0  # electrolyte/ohmic intercept activation energy
  noise_level: 0.02                # fractional amplitude; mimics ~2% potentiostat noise typical of lab EIS
  noise_model: combined            # white | flicker | combined | none
  # Seeds the synthetic EIS noise generator (white/flicker
  # terms) and, when the default AutoEIS ecm fitter is used, its MCMC sampler
  # too -- see PyBaMMOracle(seed=...). null (default) leaves both unseeded.
  seed: null
  # "combined" noise budget split between the flicker (1/f) and white terms.
  noise_combined_flicker_frac: 0.75
  noise_combined_white_frac: 0.25
  # SOC is clamped to this range before equilibrium EIS is simulated (avoids the
  # particle-concentration singularities at the extremes).
  soc_clip_min: 0.05
  soc_clip_max: 0.99
  # Kramers-Kronig linKK validation (impedance.py), used both for the oracle's
  # per-cycle linkk_rmse diagnostic.
  linkk:
    c: 0.85
    max_M: 50

ecm:
  # Equivalent-circuit structure fitted to each EIS spectrum. The ECM parameter
  # layout AND the tune engine's arc-ratio / R1-growth metrics are DERIVED from
  # this circuit (ohmic R = the resistor outside any [R,CPE] arc; arc Rs are the
  # bracketed resistors) -- no fixed element count is assumed anywhere. Load it via
  # battery_oracle.load_default_ecm_circuit(); the tune engine falls back to it when
  # no circuit is passed. A fallback only: in practice pass the experiment's circuit
  # (ecm.circuit, or the study's own, e.g. battery_forecast's datasets.yaml
  # default_circuit) so the oracle's state vectors match the real experiment's
  # featurization. Matches battery_oracle.circuit.DEFAULT_CIRCUIT.
  # AutoEIS labels: Rx=resistor, Pxw=CPE admittance, Pxn=CPE exponent, so this
  # 7-parameter circuit -> [R1,R2,P3w,P3n,R4,P5w,P5n].
  circuit: "R1-[R2,P3]-[R4,P5]"
  # AutoEIS initial-guess seeds for the CPE terms, keyed by canonical AutoEIS
  # label. Admittance (w) seeds are jones2022 training-partition medians, kept
  # close to the training scale; exponents (n) are typical for Li-ion cells at
  # moderate SOC (Chen2020). Both circuits are seeded: the default 7-param (arcs
  # P3/P5) and the 9-param R1-P2-[R3,P4]-[R5,P6] (arcs P4/P6, same values; P2 its
  # series CPE). Unknown labels fall back to w_default/n_default.
  cpe_seeds:
    w:
      P3w: 0.071
      P5w: 0.043
      P2w: 7.32     # 9-param series CPE
      P4w: 0.071    # 9-param arc 1
      P6w: 0.043    # 9-param arc 2
    n:
      P3n: 0.80
      P5n: 0.75
      P2n: 0.85     # 9-param series CPE
      P4n: 0.80     # 9-param arc 1
      P6n: 0.75     # 9-param arc 2
    w_default: 0.1
    n_default: 0.80
  # Spectrum-rescaling target ohmic resistance for the AutoEIS fit (Option B):
  # pooled training-median R1 (ohmic) across jones2022 featurized records. Set
  # to null to disable rescaling. See oracle.py's _autoeis_ecm docstring.
  rescale_target_r0: 0.1334
  autoeis:
    num_warmup: 500
    num_samples: 200

degradation:
  preset: accelerated              # nominal (SEI) | accelerated (SEI + lithium plating); see battery_oracle.degradation
  eol_capacity_fraction: 0.80       # OracleFailure raised when SOH < this
  capacity_check: false            # true appends a C/20 reference charge+discharge each call (~20x slower, more accurate)

  lam_ceiling: 0.95        # max allowed loss-of-active-material fraction fed into the EIS linearisation

  # DISABLED BY DEFAULT (0.0). Explicit, additive depth-of-discharge /
  # charge-induced-stress LAM term -- see oracle.py's dod_lam_scale docstring.
  # Must be calibrated to a literature magnitude or deep-DoD dataset before
  # enabling.
  dod_lam_scale: 0.0

  # Numeric constants of the active preset, read by
  # battery_oracle.degradation._build_degradation_config. The submodels of each preset
  # are fixed in that module (particle mechanics are off in both; reasons there).
  preset_constants:
    nominal: {}
    accelerated:
      plating_kinetic_rate_constant_m_s: 1.0e-9   # O'Kane et al. 2022 SI Table S5
      dead_lithium_decay_constant_s: 1.0e-6       # O'Kane et al. 2022 SI Table S5
      initial_plated_lithium_concentration_mol_m3: 0.0

# Real-cell calibration knobs. These are what the stage-B tune (battery-forecast
# oracle_tune) searches over when fitting the oracle to a dataset's EIS + capacity data.
protocol_scaling:
  # real_cell_capacity_mah varies per cell (e.g.
  # jones2022 PJ121 ~42 mAh, PJ100 ~45 mAh) and should be auto-detected per cell at
  # runtime from its own formation-cycle discharge (see
  # jones_oracle_study.detect_real_capacity_mah), not pinned to one dataset-wide
  # value. This is only the oracle's constructor default when no cell is given.
  real_cell_capacity_mah: 200.0

  kinetics_scale: 1.0   # exchange-current-density multiplier; <1 slows charge-transfer
                          # kinetics and grows the relative EIS arc size (R3/R1, R5/R1)
  sei_rate_scale: 1.0    # multiplies EC diffusivity [m2.s-1] of the parameter set (LiR2032:
                          # 2e-18 m2/s, Yang et al. 2017 Table 1). Stage B searches [1e-3, 1],
                          # i.e. D_EC in [2e-21 (Pinson & Bazant 2013), 2e-18] m2/s.
  dead_li_decay_scale: 1.0  # multiplies the preset's dead-lithium decay constant (accelerated:
                              # 1e-6 s-1). Stage B searches [0.1, 2.5] -> [1e-7 (Li et al. 2025),
                              # 2.5e-6 (top of O'Kane 2022's sweep)] s-1.
  plating_rate_scale: 1.0   # multiplies the preset's plating kinetic rate constant (accelerated:
                              # 1e-9 m/s). Stage B searches [0.1, 10] -> [1e-10 (Li et al. 2025;
                              # O'Kane et al. 2020), 1e-8 (top of O'Kane 2022's sweep)] m/s.
